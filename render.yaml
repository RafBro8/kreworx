# Render Blueprint for the Kreworx API.
#
# On the free plan while this is being built. Free services sleep after about
# fifteen minutes idle and take roughly a minute to wake, which is fine when
# the only traffic is us checking a deploy - and not fine the day a client
# clicks the link. Switch to the starter plan in the Render dashboard before
# sharing the URL with anyone; it is a plan change on the running service, not
# a migration.
services:
  - type: web
    name: kreworx-api
    runtime: node
    plan: free
    region: ohio
    rootDir: server
    # NODE_ENV=production makes npm skip devDependencies, and the compiler is
    # one of those - without --include=dev the build falls through to whatever
    # TypeScript happens to be on the build image instead of the pinned one.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render picks a default Node otherwise; pin it to what CI builds with.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard; it is a secret
      # Signs session cookies. Render generates a long random value once.
      - key: JWT_SECRET
        generateValue: true
      # One-click sign-in as the Northline staff, and a daily demo refresh.
      - key: DEMO_MODE
        value: "true"
      # Where the browser opens its socket: the API host itself, because the
      # rewrite that carries normal requests does not carry websockets.
      - key: PUBLIC_API_URL
        value: https://kreworx-api.onrender.com
      - key: CLIENT_ORIGIN
        sync: false # the Vercel URL, comma-separated if there is more than one
