# Local MongoDB for development. Published on 27030 rather than the default
# 27017 so it cannot collide with a mongod already running on this machine or
# with another project's container.
#
# It runs as a single-node replica set because scheduling uses transactions,
# which MongoDB only allows on replica sets. Atlas is always one, so this keeps
# local behaviour the same as production. The healthcheck initiates the set on
# first start and is a no-op after that.
services:
  mongo:
    image: mongo:8
    container_name: kreworx-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27030:27017"
    volumes:
      - kreworx-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  kreworx-mongo-data:
